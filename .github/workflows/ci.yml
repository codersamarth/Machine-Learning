name: Check deploy-ready site
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check curriculum.js
          node --check lecture-plan.js
          node --check cases.js
          node --check ingest.js
      - name: Run browserless app smoke tests
        run: node tests/smoke.mjs
      - name: Verify all beginner lessons and code-line explanations
        run: |
          node tests/journey-smoke.mjs
          node tests/video-smoke.mjs
      - name: Verify the lecture-ordered NotebookLM source packets and topic coverage
        run: |
          node tests/video-packets.mjs
          node tests/lecture-coverage.mjs

  browser-and-accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install testing dependencies (not needed by the deployed website)
        run: npm install --no-save --no-package-lock playwright@1.64.1 pdf-lib@1.17.1 jszip@3.10.1 @axe-core/playwright@4.11.1
      - name: Install headless Chromium
        run: npx playwright install --with-deps --only-shell chromium
      - name: Run desktop, mobile, Python and lecture-import and Video Studio browser tests
        run: node tests/browser.mjs
      - name: Exercise NotebookLM Video Studio in desktop/mobile Chromium
        run: node tests/video-studio-browser.mjs
      - name: Run WCAG accessibility regression checks
        run: node tests/accessibility.mjs
      - name: Check 320–1024px responsive layouts and mobile navigation
        run: node tests/mobile-deep.mjs
